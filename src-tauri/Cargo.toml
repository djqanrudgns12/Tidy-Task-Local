[package]
name = "tidy_task"
version = "5.6.2"
description = "여러분들의 소중한 업무를 기록해보세요!"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
getrandom = "0.3"
dotenvy = "0.15"

[dependencies]
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# 앱 안 자동 업데이트. 학교망의 인증서 검사·프록시를 그대로 따르도록 기존 reqwest와 같은 native-tls와
# 시스템 프록시만 켭니다. (zip은 Tauri v1 형식 업데이트 파일용이라 쓰지 않습니다)
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["native-tls", "system-proxy"] }
# 업데이트 내려받기 취소(select!)와 창 저장 대기(sleep)에 씁니다. 이미 Tauri가 쓰는 tokio를 그대로 공유합니다.
tokio = { version = "1", features = ["macros", "sync", "time"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
calamine = "0.26.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
csv = "1.3"
encoding_rs = "0.8"
# invoke 헤더로 보낸 한글 파일 이름(encodeURIComponent)을 되돌립니다. tauri-plugin-fs가 같은 헤더를 푸는 데 쓰는 것과 같은 크레이트(이미 의존성 트리에 있음).
percent-encoding = "2.3"
